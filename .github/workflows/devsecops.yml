name: DevSecOps Security Pipeline

on:
  push:
    branches:
      - main
      - "security/**"
      - "devsecops/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      enforce_gates:
        description: "Fail the pipeline when a scanner finds issues (true/false)"
        required: false
        default: "true"

# Least privilege: jobs only get read access unless they override this.
permissions:
  contents: read

# Cancel superseded runs on the same branch.
concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

env:
  # "false" = scanners still run and upload reports, but do not fail the job.
  ENFORCE: ${{ github.event.inputs.enforce_gates || 'true' }}
  IMAGE_NAME: nodegoat-devsecops

jobs:
  # 1. Build and basic checks
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run tests
        run: npm test --if-present

  # 2. SAST - Semgrep (runs in the official container, no deprecated action)
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep (SARIF report)
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/nodejs \
            --config p/owasp-top-ten \
            --exclude node_modules --exclude app/assets/vendor \
            --sarif --output semgrep.sarif || true

      - name: Run Semgrep (human-readable gate)
        run: |
          EXTRA=""
          semgrep scan \
            --config p/security-audit \
            --config p/nodejs \
            --config p/owasp-top-ten \
            --exclude node_modules --exclude app/assets/vendor \
            $EXTRA

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.sarif
          if-no-files-found: ignore

      # Needs GitHub Advanced Security on private repos, so never block on it.
      - name: Upload SARIF to GitHub Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # 3. Dependency / SCA - npm audit
  dependency-scan:
    name: SCA - npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Save npm audit report
        run: npm audit --json > npm-audit.json || true

      - name: Summarise findings
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("npm-audit.json"))
          v = d.get("metadata", {}).get("vulnerabilities", {})
          print("### npm audit results\n")
          print("| Critical | High | Moderate | Low | Total |")
          print("|---|---|---|---|---|")
          print(f"| {v.get('critical',0)} | {v.get('high',0)} | {v.get('moderate',0)} | {v.get('low',0)} | {v.get('total',0)} |")
          PY

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json

      - name: Security gate (fail on HIGH or CRITICAL)
        run: |
          if [ "$ENFORCE" = "true" ]; then
            npm audit --audit-level=high
          else
            npm audit --audit-level=high || echo "Gate not enforced (ENFORCE=false)"
          fi

  # 4. Secrets scanning - Gitleaks
  secret-scan:
    name: Secrets - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"

  # 5. Container scanning - Trivy
  container-scan:
    name: Container Security - Trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build NodeGoat Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      # Report first (never fails) so evidence is always produced.
      - name: Trivy report (SARIF)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          scan-type: "image"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          format: "sarif"
          output: "trivy.sarif"
          exit-code: "0"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy.sarif
          if-no-files-found: ignore

      - name: Upload SARIF to GitHub Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy

      # SBOM: full inventory of packages in the image (supply-chain evidence).
      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          scan-type: "image"
          format: "cyclonedx"
          output: "sbom.cdx.json"
          exit-code: "0"

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: ignore

      # Gate second: table output in the log, fails the job on findings.
      - name: Trivy security gate
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          scan-type: "image"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          format: "table"
          exit-code: ${{ env.ENFORCE == 'true' && '1' || '0' }}

  # 6. DAST - OWASP ZAP baseline scan against the running Docker Compose app
  dast:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start NodeGoat + MongoDB with Docker Compose
        run: docker compose up -d --build

      - name: Wait for the app on port 4000
        run: |
          for i in $(seq 1 40); do
            if curl -fs -o /dev/null http://localhost:4000/login; then
              echo "App is up"; exit 0
            fi
            echo "Waiting for app ($i/40)..."; sleep 3
          done
          echo "App did not start"; docker compose logs; exit 1

      - name: Run ZAP baseline scan
        run: |
          mkdir -p zap-out && chmod 777 zap-out
          set +e
          docker run --rm --network host -v "$PWD/zap-out:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:4000 \
            -r zap-report.html -J zap-report.json
          RC=$?
          echo "ZAP exit code: $RC (0=clean, 1=FAIL alerts, 2=warnings, 3=error)"
          echo "ZAP_RC=$RC" >> "$GITHUB_ENV"
          exit 0

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-out/

      - name: DAST security gate (fail on FAIL-level alerts or scan error)
        run: |
          if [ "$ENFORCE" = "true" ] && { [ "$ZAP_RC" = "1" ] || [ "$ZAP_RC" = "3" ]; }; then
            echo "ZAP found FAIL-level issues or errored"; exit 1
          fi
          echo "DAST gate passed (warnings are reported in the artifact)"

      - name: Stop containers
        if: always()
        run: docker compose down -v

  # 7. Final gate - one place that shows overall pass/fail
  security-gate:
    name: Security Gate Summary
    runs-on: ubuntu-latest
    needs: [build-and-test, sast, dependency-scan, secret-scan, container-scan, dast]
    if: always()
    steps:
      - name: Evaluate results
        run: |
          {
            echo "### DevSecOps security gate"
            echo ""
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Build and Test | ${{ needs.build-and-test.result }} |"
            echo "| SAST (Semgrep) | ${{ needs.sast.result }} |"
            echo "| SCA (npm audit) | ${{ needs.dependency-scan.result }} |"
            echo "| Secrets (Gitleaks) | ${{ needs.secret-scan.result }} |"
            echo "| Container (Trivy) | ${{ needs.container-scan.result }} |"
            echo "| DAST (OWASP ZAP) | ${{ needs.dast.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "One or more security stages failed - build blocked."
            exit 1
          fi
          echo "All security stages passed."
