name: DevSecOps Security Pipeline

on:
  push:
    branches:
      - main
      - "security/**"
      - "devsecops/**"

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "12"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test