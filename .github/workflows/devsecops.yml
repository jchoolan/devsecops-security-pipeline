name: DevSecOps Security Pipeline

on:
  push:
    branches:
      - main
      - "security/**"
      - "devsecops/**"

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "12"
          cache: ""

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep SAST
        run: semgrep scan --config auto app/

  dependency-scan:
    name: SCA - npm audit
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "12"
          cache: ""

      - name: Install dependencies
        run: npm install

      - name: Run dependency vulnerability scan
        run: npm audit --audit-level=critical