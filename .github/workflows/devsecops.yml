name: DevSecOps Security Pipeline

on:
  push:
    branches:
      - main
      - "security/**"
      - "devsecops/**"

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "12"
          cache: ""

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep SAST
        run: semgrep scan --config auto app/

  dependency-scan:
    name: SCA - npm audit
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "12"
          cache: ""

      - name: Install dependencies
        run: npm install

      - name: Run dependency vulnerability scan
        run: npm audit --audit-level=critical

  secret-scan:
    name: Secrets - Gitleaks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-scan:
    name: Container Security - Trivy
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build NodeGoat Docker image
        run: docker build -t nodegoat-devsecops:latest .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "nodegoat-devsecops:latest"
          scan-type: "image"
          scanners: "vuln"
          severity: "HIGH,CRITICAL"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true