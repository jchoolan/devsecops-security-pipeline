name: DevSecOps Security Pipeline

on:
  push:
    branches:
      - main
      - "security/**"
      - "devsecops/**"
  pull_request:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────────
  # 1. Build & basic checks
  # ─────────────────────────────────────────────
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run tests (if present)
        run: npm test --if-present

  # ─────────────────────────────────────────────
  # 2. SAST – Semgrep
  # ─────────────────────────────────────────────
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/nodejs
            p/owasp-top-ten
          generateSarif: true

  # ─────────────────────────────────────────────
  # 3. Dependency / SCA – npm audit
  # ─────────────────────────────────────────────
  dependency-scan:
    name: SCA - npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run npm audit (fail on high/critical)
        run: npm audit --audit-level=high

  # ─────────────────────────────────────────────
  # 4. Secrets scanning – Gitleaks
  # ─────────────────────────────────────────────
  secret-scan:
    name: Secrets - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────
  # 5. Container scanning – Trivy (BLOCKING GATE)
  # ─────────────────────────────────────────────
  container-scan:
    name: Container Security - Trivy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build NodeGoat Docker image
        run: docker build -t nodegoat-devsecops:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "nodegoat-devsecops:${{ github.sha }}"
          scan-type: "image"
          severity: "HIGH,CRITICAL"
          format: "table"
          exit-code: "1"          # ← This makes the pipeline FAIL
          ignore-unfixed: true